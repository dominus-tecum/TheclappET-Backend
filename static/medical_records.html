<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Record Management - Admin/Doctor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; padding: 24px; }
        /* Success Dialog */
.success-dialog {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
}
.success-dialog-content {
    background: white;
    border-radius: 16px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
.success-dialog-content h3 {
    color: #2d6a4f;
    font-size: 24px;
    margin-bottom: 8px;
}
.success-dialog-content p {
    font-size: 18px;
    color: #374151;
}
.success-close {
    margin-top: 20px;
    background: #2d6a4f;
    color: white;
    border: none;
    padding: 8px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%); color: white; padding: 20px 24px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; margin-bottom: 4px; }
        .header p { opacity: 0.8; font-size: 14px; }
        .logout-btn { background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .logout-btn:hover { background: #b91c1c; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card h2 { font-size: 18px; margin-bottom: 20px; color: #0f2b3d; border-left: 4px solid #2d6a4f; padding-left: 12px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2d6a4f; }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
        .btn-primary { background: #2d6a4f; color: white; }
        .btn-primary:hover { background: #1b4d3e; }
        .btn-secondary { background: #e2e8f0; color: #1a2a3a; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .tab.active { background: #2d6a4f; color: white; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .patient-search { margin-bottom: 20px; }
        .patient-list { max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 8px; }
        .patient-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #e2e8f0; }
        .patient-item:hover { background: #f1f5f9; }
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 16px; display: none; }
        .alert-success { background: #dcfce7; color: #16a34a; border: 1px solid #16a34a; }
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #dc2626; }
        .records-list { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; color: #0f2b3d; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 18px; margin: 0 4px; }
        .delete-btn { color: #dc2626; }
        .result-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .result-row input:first-child { flex: 1; }
        .result-row input:last-child { flex: 1; }
        .remove-btn { background: #dc2626; color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
        .add-btn { background: #2d6a4f; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .medication-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .medication-row input { flex: 1; min-width: 150px; }
        .medication-row .remove-btn { width: 32px; height: 32px; }
    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->

    <div style="background: white; border-radius: 24px; padding: 40px; max-width: 400px; width: 90%;">

            <div style="margin-bottom: 16px;">

            <div style="margin-bottom: 20px; position: relative;">

</div>

<!-- MAIN CONTENT -->

            <!-- PRESCRIPTIONS TAB -->

        <label>Select Patient</label>
        <input type="text" id="rxPatientSearch" placeholder="Search by name or email..." oninput="searchPatients('rx')">

                    <div id="historyPatientList" class="patient-list"></div>
                    <input type="hidden" id="historySelectedPatientId">

                <div class="form-grid">
                    <div class="form-group"><label>Visit/Procedure Type</label><input type="text" id="visitType" placeholder="Annual Physical Exam" required></div>
                    <div class="form-group"><label>Doctor Name</label><select id="historyDoctor" required><option value="">Select doctor...</option></select></div>

                <div class="form-group"><label>Clinical Notes</label><textarea id="notes" rows="3" placeholder="Patient in good health..."></textarea></div>
                <div class="form-group"><label>Follow-up Instructions</label><textarea id="followUp" rows="2" placeholder="Next annual exam in 1 year"></textarea></div>

            <!-- VIEW RECORDS TAB -->

<script>
    let authToken = localStorage.getItem('authToken');
    
    if (authToken) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
    }
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok && data.access_token) {
                localStorage.setItem('authToken', data.access_token);
                localStorage.setItem('userRole', data.user.role);
                location.reload();
            } else {
                document.getElementById('loginError').textContent = data.detail || 'Invalid credentials';
                document.getElementById('loginError').style.display = 'block';
            }
        } catch(err) {
            document.getElementById('loginError').textContent = 'Network error';
            document.getElementById('loginError').style.display = 'block';
        }
    });


    function togglePasswordVisibility() {
    const passwordInput = document.getElementById('loginPassword');
    const eyeIcon = event.target;
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
    }
}


    function logout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userRole');
        location.reload();
    }


    function requireWriteAccess() {
    const userRole = localStorage.getItem('userRole');
    if (userRole !== 'doctor') {
        showAlert('Only doctors can create medical records', 'error');
        return false;
    }
    return true;
}

function hideWriteButtonsForNonDoctors() {
    const userRole = localStorage.getItem('userRole');
    if (userRole !== 'doctor') {
        document.querySelectorAll('.btn-primary').forEach(btn => {
            btn.style.display = 'none';
        });
        
        let msg = document.querySelector('.readonly-msg');
        if (!msg) {
            msg = document.createElement('div');
            msg.className = 'alert readonly-msg';
            msg.style.background = '#e0f2fe';
            msg.style.color = '#0284c7';
            msg.style.padding = '12px';
            msg.style.borderRadius = '10px';
            msg.style.marginBottom = '16px';
            document.querySelector('.card').insertBefore(msg, document.querySelector('.card').firstChild);
        }
        
        if (userRole === 'admin') {
            msg.innerHTML = '👑 <strong>Admin View</strong> - You can view all records but cannot create medical records. Only doctors can prescribe medication.';
        } else {
            msg.innerHTML = '📖 <strong>Read-Only Mode</strong> - You are viewing as nurse/staff. Only doctors can create medical records.';
        }
    }
}


function showSuccessMessage() {
    const dialog = document.createElement('div');
    dialog.className = 'success-dialog';
    dialog.innerHTML = `
        <div class="success-dialog-content">
            <h3>✅ Prescription Saved Successfully!</h3>
            <button class="success-close" onclick="this.closest('.success-dialog').remove()">OK</button>
        </div>
    `;
    document.body.appendChild(dialog);
    
    // Auto close after 2 seconds
    setTimeout(() => {
        if (dialog) dialog.remove();
    }, 2000);
}








    async function loadDoctors() {
    try {
        const response = await fetch('/api/users?role=doctor', {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();
        const doctors = Array.isArray(data) ? data : (data.users || []);
        return doctors.filter(d => d.status === 'approved');
    } catch (error) {
        console.error('Error loading doctors:', error);
        return [];
    }
}


// Add this function to check token expiration
async function checkTokenAndWarn() {
    const token = localStorage.getItem('authToken');
    if (!token) return false;
    
    try {
        // Decode token to check expiration
        const payload = JSON.parse(atob(token.split('.')[1]));
        const expiryTime = payload.exp * 1000;
        const now = Date.now();
        
        if (now >= expiryTime) {
            alert('Your session has expired. Please login again.');
            localStorage.removeItem('authToken');
            location.reload();
            return false;
        }
        return true;
    } catch(e) {
        return false;
    }
}

// Call this before making API calls
async function makeAuthenticatedRequest(url, options) {
    const isTokenValid = await checkTokenAndWarn();
    if (!isTokenValid) return null;
    
    // Proceed with request
    return fetch(url, {
        ...options,
        headers: {
            ...options.headers,
            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
        }
    });
}


// After auth check
if (authToken) {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    (async () => {
        await loadCurrentDoctor();
        await populateDoctorDropdowns();
        hideWriteButtonsForNonDoctors();
    })();
}


let currentDoctorName = '';
let currentDoctorId = null;
let assignedPatients = [];

async function loadCurrentDoctor() {
    try {
        const response = await fetch('/auth/me', {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const user = await response.json();
        if (user.role === 'doctor') {
            currentDoctorName = user.name || user.username;
            currentDoctorId = user.id;
            
            // Fetch assigned patients
            await loadAssignedPatients();
            
            // Pre-fill doctor dropdowns
            const doctorSelects = ['labDoctor', 'rxDoctor', 'historyDoctor'];
            doctorSelects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    select.value = currentDoctorName;
                }
            });
        }
    } catch (error) {
        console.error('Error loading current doctor:', error);
    }
}


async function loadAssignedPatients() {
    try {
        console.log('🔍 Fetching assigned patients for doctor ID:', currentDoctorId);
        const response = await fetch(`/api/doctors/${currentDoctorId}/patients`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();
        console.log('📦 Response data:', data);
        assignedPatients = data.patients || [];
        console.log(`✅ Loaded ${assignedPatients.length} assigned patients:`, assignedPatients);
    } catch (error) {
        console.error('Error loading assigned patients:', error);
        assignedPatients = [];
    }
}



// Show all assigned patients when search box gets focus
document.getElementById('labPatientSearch').addEventListener('focus', function() {
    displayAllPatients('lab');
});
document.getElementById('rxPatientSearch').addEventListener('focus', function() {
    displayAllPatients('rx');
});
document.getElementById('historyPatientSearch').addEventListener('focus', function() {
    displayAllPatients('history');
});


function displayAllPatients(type) {
    const listDiv = document.getElementById(`${type}PatientList`);
    if (!assignedPatients.length) {
        listDiv.innerHTML = '<div class="patient-item">No assigned patients</div>';
        return;
    }
    
    let html = '';
    assignedPatients.forEach(p => {
        html += `<div class="patient-item" onclick="selectPatient('${type}', '${p.id}', '${p.name}')">
                    <strong>${escapeHtml(p.name)}</strong><br>
                    <small>${escapeHtml(p.email)}</small>
                 </div>`;
    });
    listDiv.innerHTML = html;
}



async function populateDoctorDropdowns() {
    const doctors = await loadDoctors();
    const doctorSelects = ['labDoctor', 'rxDoctor', 'historyDoctor'];
    
    doctorSelects.forEach(selectId => {
        const select = document.getElementById(selectId);
        if (select) {
            select.innerHTML = '<option value="">Select doctor...</option>';
            
            // If current user is doctor, add them as an option and select them
            if (currentDoctorName) {
                const option = document.createElement('option');
                option.value = currentDoctorName;
                option.textContent = `${currentDoctorName} (You)`;
                select.appendChild(option);
                select.value = currentDoctorName;
            }
            
            // Add other doctors
            doctors.forEach(doctor => {
                if (doctor.name !== currentDoctorName) {
                    const option = document.createElement('option');
                    option.value = doctor.name;
                    option.textContent = `${doctor.name} (${doctor.specialty || 'General'})`;
                    select.appendChild(option);
                }
            });
        }
    });
}

    function showAlert(msg, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.textContent = msg;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 3000);
    }
    
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        const tabs = { lab: 0, prescription: 1, history: 2, view: 3 };
        document.querySelectorAll('.tab')[tabs[tab]].classList.add('active');
        document.getElementById(`${tab}Tab`).classList.add('active');
        if (tab === 'view') loadAllRecords();
    }
    
    // Dynamic result fields for lab tests
    let resultCount = 0;


    function addResultField() {
    const container = document.getElementById('resultsContainer');
    const div = document.createElement('div');

let currentEditingRow = null;
let currentMedName = '';

function openInstructionModal(row, medName) {
    currentEditingRow = row;
    currentMedName = medName;
    document.getElementById('modalMedName').innerText = medName || 'Unnamed Medication';
    
    // Get existing instructions from hidden field
    let instructionsField = row.querySelector('.med-instructions');
    if (instructionsField) {
        document.getElementById('modalInstructions').value = instructionsField.value;
    } else {
        document.getElementById('modalInstructions').value = '';
    }
    
    document.getElementById('instructionModal').style.display = 'flex';
}

function closeInstructionModal() {
    document.getElementById('instructionModal').style.display = 'none';
    currentEditingRow = null;
}

function saveInstructionModal() {
    if (currentEditingRow) {
        let instructionsField = currentEditingRow.querySelector('.med-instructions');
        if (!instructionsField) {
            instructionsField = document.createElement('input');
            instructionsField.type = 'hidden';
            instructionsField.className = 'med-instructions';
            currentEditingRow.appendChild(instructionsField);
        }
        instructionsField.value = document.getElementById('modalInstructions').value;
        
        // Show saved indicator
        const medNameInput = currentEditingRow.querySelector('.med-name');

        }, 500);
    }
    closeInstructionModal();
}


    function calculateBMI() {
    const heightInput = document.getElementById('height');
    const weightInput = document.getElementById('weight');
    const bmiInput = document.getElementById('bmi');
    
    
    const height = parseFloat(heightInput.value);
    const weight = parseFloat(weightInput.value);
    
    if (height && weight && height > 0 && weight > 0) {
        // Convert height from cm to meters
        const heightInMeters = height / 100;
        const bmi = weight / (heightInMeters * heightInMeters);
        bmiInput.value = bmi.toFixed(1);
    } else {
        bmiInput.value = '';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}





    
    async function searchPatients(type) {
    const searchInput = document.getElementById(`${type}PatientSearch`);
    const listDiv = document.getElementById(`${type}PatientList`);
    const term = searchInput.value.toLowerCase();
    if (term.length < 2) { listDiv.innerHTML = ''; return; }
    
    // Use assignedPatients instead of API call
    const filtered = assignedPatients.filter(p => 
        (p.name && p.name.toLowerCase().includes(term)) || 
        (p.email && p.email.toLowerCase().includes(term))
    );
    
    let html = '';
    filtered.forEach(p => {
        html += `<div class="patient-item" onclick="selectPatient('${type}', '${p.id}', '${p.name}')">
                    <strong>${escapeHtml(p.name)}</strong><br>
                    <small>${escapeHtml(p.email)}</small>
                 </div>`;
    });
    listDiv.innerHTML = html;
}
    
    let currentSelectedPatientId = null;

function selectPatient(type, id, name) {
    // Store current patient globally
    currentSelectedPatientId = id;
    
    // Update ALL tabs (lab, rx, history)
    const tabTypes = ['lab', 'rx', 'history'];
    tabTypes.forEach(t => {
        document.getElementById(`${t}SelectedPatientId`).value = id;
        document.getElementById(`${t}SelectedPatientName`).value = name;
        document.getElementById(`${t}PatientSearch`).value = name;
        document.getElementById(`${t}PatientList`).innerHTML = '';
    });
    
    // Fetch and set current doctor for ALL tabs
    fetchCurrentDoctor(id);
}

// Add this NEW function
async function fetchCurrentDoctor(patientId) {
    try {
        const res = await fetch(`/api/patients/${patientId}/current-doctor`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.doctor) {
            // Set doctor in all three dropdowns
            const doctorSelects = ['labDoctor', 'rxDoctor', 'historyDoctor'];
            doctorSelects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    select.value = data.doctor.name;
                }
            });
        }
    } catch(err) {
        console.error('Error fetching doctor:', err);
    }
}

// Add this NEW function to change doctor
async function changePatientDoctor() {
    if (!currentSelectedPatientId) {
        alert('Please select a patient first');
        return;
    }
    
    const newDoctorName = prompt('Enter new doctor name:');
    if (!newDoctorName) return;
    
    try {
        // Find doctor ID by name
        const searchRes = await fetch(`/api/doctors/search?q=${encodeURIComponent(newDoctorName)}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const searchData = await searchRes.json();
        
        if (!searchData.doctors || searchData.doctors.length === 0) {
            alert('Doctor not found. Please register the doctor first.');
            return;
        }
        
        const doctor = searchData.doctors[0];
        
        // Assign doctor to patient
        const assignRes = await fetch(`/api/patients/${currentSelectedPatientId}/assign-doctor`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ doctor_id: doctor.id, reason: 'Doctor changed' })
        });
        
        if (assignRes.ok) {
            alert(`Doctor changed to ${doctor.name}`);
            // Refresh doctor in dropdowns
            fetchCurrentDoctor(currentSelectedPatientId);
        } else {
            alert('Failed to change doctor');
        }
    } catch(err) {
        console.error('Error:', err);
        alert('Network error');
    }
}

    async function createPrescription() {
    if (!requireWriteAccess()) return;
    
    const patientId = document.getElementById('rxSelectedPatientId').value;
    const patientName = document.getElementById('rxSelectedPatientName').value;
    const doctor = document.getElementById('rxDoctor').value;
    const date = document.getElementById('rxDate').value;
    const status = document.getElementById('rxStatus').value;
    
    // Collect ALL medications with their individual instructions
    const medications = [];
    const medRows = document.querySelectorAll('#medicationsContainer .medication-row');
    
    medRows.forEach(row => {
        const name = row.querySelector('.med-name').value;
        const dosage = row.querySelector('.med-dosage').value;
        const frequency = row.querySelector('.med-frequency').value;
        const quantity = row.querySelector('.med-quantity').value;
        const refills = row.querySelector('.med-refills').value;
        const instructionsField = row.querySelector('.med-instructions');
        const instructions = instructionsField ? instructionsField.value : '';
        
        if (name && dosage && frequency) {
            medications.push({ 
                medication_name: name, 
                dosage: dosage, 
                frequency: frequency, 
                quantity: quantity || null, 
                refills: refills || null,
                instructions: instructions
            });
        }
    });
    
    if (!patientId || medications.length === 0 || !doctor || !date) { 
        showAlert('Fill required fields and add at least one medication', 'error'); 
        return; 
    }
    
    let successCount = 0;
    let errorCount = 0;
    
    // Save EACH medication with its own instructions
    for (let i = 0; i < medications.length; i++) {
        const med = medications[i];
        const details = { 
            medication_name: med.medication_name, 
            dosage: med.dosage, 
            frequency: med.frequency, 
            quantity: med.quantity, 
            refills: med.refills, 
            instructions: med.instructions,
            purpose: '' 
        };
        
        const record = { 
            patient_id: patientId, 
            patient_name: patientName, 
            type: `${med.medication_name} ${med.dosage}`, 
            category: 'Prescriptions', 
            doctor: doctor, 
            date: date, 
            status: status, 
            details: details 
        };
        
        try {
            const res = await fetch('/api/medical-record/', { 
                method: 'POST', 
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${authToken}`
                }, 
                body: JSON.stringify(record) 
            });
            
            if (res.ok) {
                successCount++;
            } else {
                errorCount++;
            }
        } catch(err) { 
            errorCount++;
        }
    }
    
    if (successCount > 0) {
        showSuccessMessage(`Prescription Saved Successfully! (${successCount} medication${successCount > 1 ? 's' : ''})`);
        document.getElementById('medicationsContainer').innerHTML = ''; 
        addMedicationField();
    } else {
        showAlert('Failed to save prescriptions', 'error');
    }
}

    async function loadAllRecords() {
    try {
        console.log("🟢 Loading all records...");
        const res = await fetch('/api/medical-record/', { 
            headers: { 'Authorization': `Bearer ${authToken}` } 
        });
        console.log("Response status:", res.status);
        
        const data = await res.json();
        console.log("Full response:", data);
        
        // Check different response formats
        let records = [];
        if (data.records && Array.isArray(data.records)) {
            records = data.records;

            console.log("First record details:", records[0]);
            console.log("Record keys:", Object.keys(records[0]));
            console.log("Found records in data.records:", records.length);
        } else if (Array.isArray(data)) {
            records = data;
            console.log("Response is directly an array:", records.length);
        } else {
            console.log("No records found in response");
        }
        
        if (records.length === 0) { 
            document.getElementById('recordsList').innerHTML = '<p>No records found.</p>'; 
            return; 
        }
        
        let html = `<table><thead><tr><th>Date</th><th>Patient</th><th>Type</th><th>Category</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        records.forEach(r => {
            html += `<tr>
                <td>${r.date || '—'}</td>
                <td>${r.patient_name || '—'}</td>
                <td>${r.type || '—'}</td>
                <td>${r.category || '—'}</td>
                <td>${r.doctor || '—'}</td>
                <td>${r.status || '—'}</td>
                <td><button class="action-btn delete-btn" onclick="deleteRecord('${r.id}')">🗑️</button></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('recordsList').innerHTML = html;
        
    } catch(err) { 
        console.error("Error loading records:", err);
        document.getElementById('recordsList').innerHTML = '<p>Error loading records</p>'; 
    }
}
    
    async function deleteRecord(id) {
        if (!requireWriteAccess()) return;
        if (!confirm('Delete this record?')) return;
        try {
            const res = await fetch(`/api/medical-record/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } });
            if (res.ok) { showAlert('Record deleted', 'success'); loadAllRecords(); }
            else { showAlert('Delete failed', 'error'); }
        } catch(err) { showAlert('Error', 'error'); }
    }
